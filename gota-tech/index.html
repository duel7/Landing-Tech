        <h1>Gota Tech</h1>
        <p>Sistema sustentável de captação pluvial — projeto de pesquisa da Escola Municipal Anne Frank, Palmas (TO).</p>
        <p>A chuva atinge o telhado e é conduzida pelas calhas; a água percorre tubulações, passa por um filtro simples que retém folhas e partículas e fica armazenada em um reservatório adequado, podendo ser destinada a usos não potáveis, como irrigação de plantas, limpeza de áreas externas e descargas sanitárias.</p>
